# https://lefthook.dev/configuration/
pre-commit:
  commands:
    format:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,css,md,yml,yaml,html}'
      exclude:
        - pnpm-lock.yaml
        - dist/**
        - drizzle/**
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
